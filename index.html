<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futsal Rotation</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<script src="sortable.min.js"></script>
<style>
  :root { --orange:#f97316; --blue:#2563eb; --gray:#9ca3af; --bg:#111827; --card:#1f2937; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:#fff;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { padding:12px 16px 8px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  h1 { font-size:1.4rem; margin:0 auto 0 0; }
  button { font:inherit; font-weight:800; border:0; border-radius:14px; padding:16px 22px; color:#fff;
           font-size:1.25rem; cursor:pointer; touch-action:manipulation; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  .start { background:#16a34a; }
  .o { background:var(--orange); } .b { background:var(--blue); } .both { background:#7c3aed; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; padding:0 16px 8px; }
  .controls button { flex:1 1 180px; }
  .add { display:flex; gap:8px; padding:0 16px 8px; }
  .add input { flex:1; font-size:1.2rem; padding:12px 14px; border-radius:12px; border:2px solid #374151; background:var(--card); color:#fff; min-width:0; }
  .add button { background:#374151; padding:12px 20px; }
  #status { padding:0 16px 8px; color:#d1d5db; font-size:1.05rem; }
  #list { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; margin:0; padding:8px 16px 24px; list-style:none; }
  li { display:flex; align-items:center; gap:14px; margin-bottom:10px; border-radius:18px; padding:6px 10px 6px 6px;
       background:var(--gray); color:#111827; min-height:84px; }
  li.orange { background:var(--orange); color:#fff; }
  li.blue { background:var(--blue); color:#fff; }
  .pos { font-size:1.6rem; font-weight:800; width:52px; text-align:center; opacity:.85; }
  .name { flex:1; font-size:clamp(2rem,5.5vw,3.4rem); font-weight:800; line-height:1.1; overflow-wrap:anywhere; }
  .handle { font-size:2.4rem; padding:10px 18px; cursor:grab; touch-action:none; user-select:none; opacity:.8; }
  .del { background:rgba(0,0,0,.25); padding:8px 14px; font-size:1.4rem; border-radius:12px; }
  .sortable-ghost { opacity:.35; }
  .sortable-chosen { box-shadow:0 8px 24px rgba(0,0,0,.5); }
  .divider { text-align:center; color:#9ca3af; font-weight:700; margin:-2px 0 8px; }
  #panel { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; z-index:10; padding:max(16px,env(safe-area-inset-top)) 16px 16px; }
  #panel.open { display:flex; }
  .sheet { margin:auto; width:100%; max-width:720px; max-height:100%; background:var(--card); border-radius:20px; display:flex; flex-direction:column; padding:16px; }
  .sheet h2 { margin:0 0 4px; font-size:1.6rem; }
  .sheet p { margin:0 0 10px; color:#d1d5db; }
  .sheet .row { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .sheet .row button { padding:12px 16px; font-size:1.1rem; background:#374151; flex:1; }
  .sheet .row button.done { background:#16a34a; }
  #rosterList { overflow-y:auto; list-style:none; margin:0 0 10px; padding:0; flex:1; }
  #rosterList li { background:#374151; color:#fff; min-height:64px; margin-bottom:8px; cursor:pointer; }
  #rosterList li.on { background:#16a34a; }
  #rosterList .name { font-size:1.7rem; }
  .check { font-size:2rem; width:48px; text-align:center; }
</style>
</head>
<body>
<header><h1>⚽ Futsal Rotation</h1></header>
<div class="controls">
  <button class="start" id="start">▶ Start Game</button>
  <button class="o" id="outO">Orange Out</button>
  <button class="b" id="outB">Blue Out</button>
  <button class="both" id="outBoth">Both Out</button>
  <button id="rosterBtn" style="background:#374151">👥 Roster</button>
</div>
<div id="status"></div>
<ul id="list"></ul>
<div id="panel"><div class="sheet">
  <h2>Roster</h2>
  <p>Tap a name to add/remove it from tonight's game. Saved on this device.</p>
  <div class="row"><button id="selAll">Select all</button><button id="selNone">Select none</button><button class="done" id="closePanel">Done</button></div>
  <ul id="rosterList"></ul>
  <form class="add" id="addForm" style="padding:0">
    <input id="newName" placeholder="Add new name to roster" autocomplete="off" autocapitalize="words">
    <button type="submit">Add</button>
  </form>
</div></div>

<script>
const KEY = 'futsal-rotation-v2';
const ROSTER = ['Akash Soccer','Kurvin','Ayodeji','Rayan Resenha Futebol','Brunno Futebol','Olamide Soccer','Ricardo Soccer','Giovanni Soccer Angui','Eder Soccer','Dr Richardson','Dafe Soccer','Rilwan Omololu Bello','Christovao Junger','Jaime Soccer Elite','Imajinary','Evans'];
let state = { roster: ROSTER.slice(), players: ROSTER.slice(), started: false };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.players) && Array.isArray(s.roster)) state = s; } catch (e) {}

const $ = id => document.getElementById(id);
const listEl = $('list');
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function render() {
  listEl.innerHTML = '';
  state.players.forEach((name, i) => {
    const li = document.createElement('li');
    if (state.started) li.className = i < 5 ? 'orange' : i < 10 ? 'blue' : '';
    li.innerHTML = '<span class="pos"></span><span class="name"></span><button class="del" aria-label="Remove">✕</button><span class="handle" aria-label="Drag">☰</span>';
    li.querySelector('.pos').textContent = i + 1;
    li.querySelector('.name').textContent = name;
    li.querySelector('.del').onclick = () => {
      state.players.splice(i, 1); save(); render(); renderRoster();
    };
    li.querySelector('.name').onclick = () => {
      const v = (prompt('Edit name', name) || '').trim();
      if (!v || v === name) return;
      const r = state.roster.indexOf(name); if (r >= 0) state.roster[r] = v;
      state.players[i] = v; save(); render(); renderRoster();
    };
    listEl.appendChild(li);
  });
  const n = state.players.length;
  $('start').disabled = n < 1;
  $('outO').disabled = $('outB').disabled = $('outBoth').disabled = !state.started;
  $('status').textContent = state.started
    ? 'Game on: top 5 Orange vs next 5 Blue. Next up: ' + (state.players[10] || '—')
    : 'Press Start Game to assign teams. Drag ☰ to reorder, tap a name to edit, 👥 Roster to pick players.';
}

$('start').onclick = () => { state.started = true; save(); render(); };

function out(count, from) {
  const p = state.players;
  const leaving = p.splice(from, count);
  state.players = p.concat(shuffle(leaving));
  state.started = false; // press Start Game to re-form teams
  save(); render();
  listEl.scrollTop = 0;
}
$('outO').onclick = () => out(5, 0);   // orange = positions 1-5
$('outB').onclick = () => out(5, 5);   // blue = positions 6-10
$('outBoth').onclick = () => out(10, 0);

function renderRoster() {
  const ul = $('rosterList'); ul.innerHTML = '';
  state.roster.forEach(name => {
    const on = state.players.includes(name);
    const li = document.createElement('li'); li.className = on ? 'on' : '';
    li.innerHTML = '<span class="check"></span><span class="name"></span><button class="del" aria-label="Delete from roster">🗑</button>';
    li.querySelector('.check').textContent = on ? '✓' : '+';
    li.querySelector('.name').textContent = name;
    li.onclick = () => {
      state.players = on ? state.players.filter(p => p !== name) : state.players.concat(name);
      save(); render(); renderRoster();
    };
    li.querySelector('.del').onclick = e => {
      e.stopPropagation();
      if (!confirm('Delete ' + name + ' from roster?')) return;
      state.roster = state.roster.filter(p => p !== name);
      state.players = state.players.filter(p => p !== name);
      save(); render(); renderRoster();
    };
    ul.appendChild(li);
  });
}
$('rosterBtn').onclick = () => { renderRoster(); $('panel').classList.add('open'); };
$('closePanel').onclick = () => $('panel').classList.remove('open');
$('selAll').onclick = () => { state.players = state.players.concat(state.roster.filter(n => !state.players.includes(n))); save(); render(); renderRoster(); };
$('selNone').onclick = () => { state.players = []; state.started = false; save(); render(); renderRoster(); };
$('addForm').onsubmit = e => {
  e.preventDefault();
  const v = $('newName').value.trim();
  if (!v) return;
  if (!state.roster.includes(v)) state.roster.push(v);
  if (!state.players.includes(v)) state.players.push(v);
  $('newName').value = '';
  save(); render(); renderRoster();
  $('rosterList').scrollTop = $('rosterList').scrollHeight;
};

Sortable.create(listEl, {
  handle: '.handle', animation: 150, forceFallback: false,
  scroll: true, scrollSensitivity: 80, scrollSpeed: 15,
  onEnd: e => {
    if (e.oldIndex === e.newIndex) return;
    const [m] = state.players.splice(e.oldIndex, 1);
    state.players.splice(e.newIndex, 0, m);
    save(); render();
  }
});
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
