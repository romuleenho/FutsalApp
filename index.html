<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Futsal Rotation</title>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<style>
  :root { --orange:#f97316; --blue:#2563eb; --gray:#9ca3af; --bg:#111827; --card:#1f2937; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; }
  body { display:flex; flex-direction:column; background:var(--bg); color:#fff;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { padding:12px 16px 8px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  h1 { font-size:1.4rem; margin:0 auto 0 0; }
  button { font:inherit; font-weight:800; border:0; border-radius:14px; padding:16px 22px; color:#fff;
           font-size:1.25rem; cursor:pointer; touch-action:manipulation; }
  button:disabled { opacity:.35; cursor:not-allowed; }
  .start { background:#16a34a; }
  .o { background:var(--orange); } .b { background:var(--blue); } .both { background:#7c3aed; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; padding:0 16px 8px; }
  .controls button { flex:1 1 180px; }
  .add { display:flex; gap:8px; padding:0 16px 8px; }
  .add input { flex:1; font-size:1.2rem; padding:12px 14px; border-radius:12px; border:2px solid #374151; background:var(--card); color:#fff; min-width:0; }
  .add button { background:#374151; padding:12px 20px; }
  #status { padding:0 16px 8px; color:#d1d5db; font-size:1.05rem; }
  #list { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; margin:0; padding:8px 16px 24px; list-style:none; }
  li { display:flex; align-items:center; gap:14px; margin-bottom:10px; border-radius:18px; padding:6px 10px 6px 6px;
       background:var(--gray); color:#111827; min-height:84px; }
  li.orange { background:var(--orange); color:#fff; }
  li.blue { background:var(--blue); color:#fff; }
  .pos { font-size:1.6rem; font-weight:800; width:52px; text-align:center; opacity:.85; }
  .name { flex:1; font-size:clamp(2rem,5.5vw,3.4rem); font-weight:800; line-height:1.1; overflow-wrap:anywhere; }
  .handle { font-size:2.4rem; padding:10px 18px; cursor:grab; touch-action:none; user-select:none; opacity:.8; }
  .del { background:rgba(0,0,0,.25); padding:8px 14px; font-size:1.4rem; border-radius:12px; }
  .sortable-ghost { opacity:.35; }
  .sortable-chosen { box-shadow:0 8px 24px rgba(0,0,0,.5); }
  .divider { text-align:center; color:#9ca3af; font-weight:700; margin:-2px 0 8px; }
</style>
</head>
<body>
<header><h1>⚽ Futsal Rotation</h1></header>
<div class="controls">
  <button class="start" id="start">▶ Start Game</button>
  <button class="o" id="outO">Orange Out</button>
  <button class="b" id="outB">Blue Out</button>
  <button class="both" id="outBoth">Both Out</button>
</div>
<form class="add" id="addForm">
  <input id="newName" placeholder="Add player name" autocomplete="off" autocapitalize="words">
  <button type="submit">Add</button>
</form>
<div id="status"></div>
<ul id="list"></ul>

<script>
const KEY = 'futsal-rotation-v1';
const DEFAULTS = ['Player 1','Player 2','Player 3','Player 4','Player 5','Player 6','Player 7','Player 8','Player 9','Player 10','Player 11','Player 12','Player 13','Player 14'];
let state = { players: DEFAULTS.slice(), started: false };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.players)) state = s; } catch (e) {}

const $ = id => document.getElementById(id);
const listEl = $('list');
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

function render() {
  listEl.innerHTML = '';
  state.players.forEach((name, i) => {
    const li = document.createElement('li');
    if (state.started) li.className = i < 5 ? 'orange' : i < 10 ? 'blue' : '';
    li.innerHTML = '<span class="pos"></span><span class="name"></span><button class="del" aria-label="Remove">✕</button><span class="handle" aria-label="Drag">☰</span>';
    li.querySelector('.pos').textContent = i + 1;
    li.querySelector('.name').textContent = name;
    li.querySelector('.del').onclick = () => {
      if (confirm('Remove ' + name + '?')) { state.players.splice(i, 1); save(); render(); }
    };
    listEl.appendChild(li);
  });
  const n = state.players.length;
  $('start').disabled = n < 1;
  $('outO').disabled = $('outB').disabled = $('outBoth').disabled = !state.started;
  $('status').textContent = state.started
    ? 'Game on: top 5 Orange vs next 5 Blue. Next up: ' + (state.players[10] || '—')
    : 'Press Start Game to assign teams. Drag ☰ to reorder anytime.';
}

$('start').onclick = () => { state.started = true; save(); render(); };

function out(count, from) {
  const p = state.players;
  const leaving = p.splice(from, count);
  state.players = p.concat(shuffle(leaving));
  state.started = false; // press Start Game to re-form teams
  save(); render();
  listEl.scrollTop = 0;
}
$('outO').onclick = () => out(5, 0);   // orange = positions 1-5
$('outB').onclick = () => out(5, 5);   // blue = positions 6-10
$('outBoth').onclick = () => out(10, 0);

$('addForm').onsubmit = e => {
  e.preventDefault();
  const v = $('newName').value.trim();
  if (!v) return;
  state.players.push(v); $('newName').value = '';
  save(); render();
  listEl.scrollTop = listEl.scrollHeight;
};

Sortable.create(listEl, {
  handle: '.handle', animation: 150, forceFallback: false,
  scroll: true, scrollSensitivity: 80, scrollSpeed: 15,
  onEnd: e => {
    if (e.oldIndex === e.newIndex) return;
    const [m] = state.players.splice(e.oldIndex, 1);
    state.players.splice(e.newIndex, 0, m);
    save(); render();
  }
});
render();
</script>
</body>
</html>
